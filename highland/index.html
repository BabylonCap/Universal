<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADIUVAT Índices</title>

  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 420px;
      margin: 40px auto;
    }

    .fb-page-square {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      background: linear-gradient(135deg, #0f172a, #020617);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 14px;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      letter-spacing: 1px;
    }

    .grid {
      flex: 1;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
    }

    .card {
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .title {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .value {
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 4px;
    }

    .change {
      font-size: 0.8rem;
    }

    .positive { color: #22c55e; }
    .negative { color: #ef4444; }

    .footer {
      text-align: center;
      font-size: 0.7rem;
      padding: 8px;
      opacity: 0.5;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="fb-page-square">

    <div class="header">ADIUVAT INDICES</div>

    <div class="grid">

      <div class="card">
        <div class="title">🔐 Seguridad (BTC)</div>
        <div class="value" id="btc">...</div>
        <div class="change" id="btcChange"></div>
      </div>

      <div class="card">
        <div class="title">🛡 Garantía (USDT)</div>
        <div class="value" id="usdt">...</div>
        <div class="change" id="usdtChange"></div>
      </div>

      <div class="card">
        <div class="title">⚙️ 4RI (ETH)</div>
        <div class="value" id="eth">...</div>
        <div class="change" id="ethChange"></div>
      </div>

    </div>

    <div class="footer">Datos en tiempo real</div>

  </div>
</div>

<script>
async function loadData() {
  try {
    const res = await fetch(
      "https://api.allorigins.win/raw?url=https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether&vs_currencies=usd&include_24hr_change=true"
    );

    const data = await res.json();

    function set(idPrice, idChange, price, change) {
      const priceEl = document.getElementById(idPrice);
      const changeEl = document.getElementById(idChange);

      if (!price) {
        priceEl.innerText = "—";
        changeEl.innerText = "Sin datos";
        return;
      }

      priceEl.innerText = "$" + price.toLocaleString();

      changeEl.innerText = change.toFixed(2) + "%";
      changeEl.className = "change " + (change >= 0 ? "positive" : "negative");
    }

    set("btc", "btcChange", data.bitcoin.usd, data.bitcoin.usd_24h_change);
    set("eth", "ethChange", data.ethereum.usd, data.ethereum.usd_24h_change);
    set("usdt", "usdtChange", data.tether.usd, data.tether.usd_24h_change);

  } catch (e) {
    console.error(e);
    document.getElementById("btc").innerText = "Error";
    document.getElementById("eth").innerText = "Error";
    document.getElementById("usdt").innerText = "Error";
  }
}

loadData();
setInterval(loadData, 30000);
</script>

</body>
</html>
